services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gimzup}
      MYSQL_USER: ${MYSQL_USER:-gimzup}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gimzup}?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: ${MYSQL_USER:-gimzup}
      DB_PASSWORD: ${MYSQL_PASSWORD:-local_password}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
